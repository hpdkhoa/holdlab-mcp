[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "holdlab-mcp"
version = "0.1.0"
description = "Hold Lab: Measures the hand and arm, keeps joint limits as walls, and places holds on an object by rule."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
    "poselab-mcp @ git+https://github.com/hpdkhoa/poselab-mcp.git",
    "fakepose-mcp @ git+https://github.com/hpdkhoa/fakepose-mcp.git",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
holdlab-mcp = "holdlab.server:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/holdlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
